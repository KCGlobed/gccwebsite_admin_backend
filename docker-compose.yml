version: "3.9"

services:
  web:
    build: .
    image: GCC_School_Backend
    ports:
      # - "8000:8000"
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    command: >
      sh -c "
      python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "